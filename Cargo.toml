[package]
name = "bouquineur"
version = "0.1.0"
authors = ["traxys <quentin@familleboyer.net>"]
edition = "2021"

[dependencies]
ammonia = "4.2.1"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart", "query"] }
base64 = "0.23.1"
bstr = "1.13.1"
chrono = "0.4.45"
diesel = { version = "2.3.14", features = ["chrono", "postgres", "uuid"] }
diesel-async = { version = "0.9.2", features = ["deadpool", "postgres"] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
human-date-parser = "0.3.1"
image = "0.25.10"
maud = { version = "0.27.0", features = ["axum"] }
parse_datetime = "0.11.0"
reqwest = { version = "0.13.5" }
roxmltree = { version = "0.21.1", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["tracing-log"] }
uuid = { version = "1.28.0", features = ["serde"] }

[dev-dependencies]
expect-test = "1.5.1"
